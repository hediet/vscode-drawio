name: Lint & Build
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test-unit
      - run: yarn build
