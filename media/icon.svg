<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- The icon of the extension: a stack of slides whose front slide holds a small diagram, three
       nodes and two edges. media/icon.png is this drawing at 256 pixels, which package.json names.
       It keeps clear of the orange and the shape of the draw.io logo, which the trademark
       guidelines of draw.io forbid as or in the icon of another product. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#ground)"/>
  <rect x="62" y="42" width="160" height="112" rx="12" fill="#FFFFFF" opacity="0.35"/>
  <rect x="48" y="56" width="160" height="112" rx="12" fill="#FFFFFF" opacity="0.6"/>
  <rect x="34" y="70" width="160" height="112" rx="12" fill="#FFFFFF"/>
  <path d="M80 104 L148 104 M80 104 L148 150" stroke="#312E81" stroke-width="6" stroke-linecap="round" fill="none"/>
  <rect x="58" y="90" width="44" height="28" rx="7" fill="#312E81"/>
  <circle cx="152" cy="104" r="15" fill="#0E7490"/>
  <rect x="134" y="138" width="36" height="24" rx="12" fill="#14B8A6"/>
  <path d="M112 196 L144 196 L128 214 Z" fill="#FFFFFF" transform="rotate(-90 128 205)"/>
</svg>
