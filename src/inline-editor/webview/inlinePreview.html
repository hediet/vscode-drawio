<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none';
             img-src ${cspSource} https: data:;
             script-src 'nonce-${nonce}' https://viewer.diagrams.net;
             style-src 'unsafe-inline';
             frame-src https://embed.diagrams.net https://*.diagrams.net https://*.draw.io http://127.0.0.1:* http://localhost:*;
             connect-src https:;
             font-src https: data:;">
  <style>
    body {
      font-family: var(--vscode-font-family, -apple-system, BlinkMacSystemFont, 'Segoe WPC', 'Segoe UI', system-ui, 'Ubuntu', 'Droid Sans', sans-serif);
      font-size: 14px;
      color: var(--vscode-editor-foreground);
      background: var(--vscode-editor-background);
      padding: 20px 50px;
      line-height: 1.6;
      position: relative;
    }

    /* Markdown styling using VS Code theme variables */
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      color: var(--vscode-editor-foreground);
      margin-top: 24px;
      margin-bottom: 16px;
      font-weight: 600;
      line-height: 1.25;
    }

    h1 {
      font-size: 2em;
      margin-top: 0;
      border-bottom: 1px solid var(--vscode-editorGroup-border);
      padding-bottom: 0.3em;
    }

    h2 {
      font-size: 1.5em;
      border-bottom: 1px solid var(--vscode-editorGroup-border);
      padding-bottom: 0.3em;
    }

    h3 {
      font-size: 1.25em;
    }

    h4 {
      font-size: 1em;
    }

    h5 {
      font-size: 0.875em;
    }

    h6 {
      font-size: 0.85em;
    }

    p {
      margin: 0.5em 0;
    }

    a {
      color: var(--vscode-textLink-foreground);
    }

    a:hover {
      color: var(--vscode-textLink-activeForeground);
    }

    code {
      font-family: var(--vscode-editor-font-family, monospace);
      font-size: 0.9em;
      background: var(--vscode-textCodeBlock-background);
      padding: 2px 5px;
      border-radius: 3px;
    }

    pre {
      background: var(--vscode-textCodeBlock-background);
      padding: 12px 16px;
      border-radius: 4px;
      overflow-x: auto;
      font-family: var(--vscode-editor-font-family, monospace);
      font-size: 14px;
      line-height: 1.4;
      white-space: pre;
    }

    pre code {
      padding: 0;
      background: none;
      font-size: inherit;
    }

    blockquote {
      border-left: 3px solid var(--vscode-textBlockQuote-border);
      margin: 0.5em 0;
      padding: 0.5em 1em;
      color: var(--vscode-textBlockQuote-foreground);
    }

    table {
      border-collapse: collapse;
      margin: 0.5em 0;
    }

    th,
    td {
      border: 1px solid var(--vscode-editorGroup-border);
      padding: 6px 12px;
    }

    th {
      background: var(--vscode-editorGroupHeader-tabsBackground);
    }

    img {
      max-width: 100%;
    }

    hr {
      border: none;
      border-top: 1px solid var(--vscode-editorGroup-border);
      margin: 1.5em 0;
    }

    ul {
      list-style: none;
      padding-left: 2em;
    }

    ul>li {
      position: relative;
    }

    ul>li::before {
      content: '–';
      position: absolute;
      left: -1.4em;
    }

    /* ── Page toolbar ── */
    #toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 50px;
      margin: -20px -50px 0px -50px;
      background: var(--vscode-editorGroupHeader-tabsBackground, var(--vscode-editor-background));
      border-bottom: 1px solid var(--vscode-editorGroup-border);
    }

    #toolbar button {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 28px;
      padding: 0 12px;
      border: 1px solid var(--vscode-button-border, var(--vscode-editorGroup-border));
      border-radius: 4px;
      background: var(--vscode-button-secondaryBackground, transparent);
      color: var(--vscode-button-secondaryForeground, var(--vscode-editor-foreground));
      font-size: 12px;
      cursor: pointer;
    }

    #toolbar button:hover {
      background: var(--vscode-button-secondaryHoverBackground, rgba(128, 128, 128, 0.15));
    }

    #toolbar .spacer {
      flex: 1;
    }

    /* ── Editable text section ── */
    .text-section {
      outline: none;
      padding: 2px 4px 2px 12px;
      margin: -2px -4px;
      border-left: 3px solid transparent;
      transition: border-color 0.15s ease;
    }

    .text-section:hover {
      border-left-color: var(--vscode-editorGroup-border);
    }

    /* ── Outer container (toolbar + editor frame) ── */
    .drawio-editor-outer {
      margin: 8px 0;
      position: relative;
      max-width: 100%;
      overflow: visible;
      /* keep toolbar row visible above the wrapper */
    }

    /* ── Inline editor wrapper (unlocked diagrams) ── */
    .drawio-editor-wrapper {
      position: relative;
      border: 1px solid var(--vscode-editorGroup-border);
      border-radius: 4px;
      overflow: hidden;
      background: transparent;
      min-height: 20px;
      max-width: 100%;
    }

    .drawio-editor-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% - 12px);
      border: none;
    }

    .drawio-editor-wrapper .preview-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% - 12px);
      cursor: pointer;
      z-index: 2;
    }

    .drawio-editor-wrapper .preview-layer .preview-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--vscode-descriptionForeground);
      font-size: 13px;
    }

    .drawio-editor-wrapper .preview-layer svg {
      max-width: 100%;
      height: auto !important;
    }

    .drawio-editor-wrapper .preview-layer,
    .drawio-editor-wrapper .preview-layer * {
      cursor: pointer !important;
    }

    .drawio-editor-wrapper .preview-layer .preview-loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--vscode-editor-background, rgba(30, 30, 30, 0.6));
      opacity: 0.7;
      z-index: 1;
    }

    .drawio-editor-wrapper .preview-layer .preview-loading-overlay span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--vscode-editor-foreground);
      font-size: 13px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .drawio-editor-wrapper .preview-layer .preview-loading-overlay .spinner {
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
    }

    .drawio-editor-wrapper .loading-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--vscode-descriptionForeground);
      font-size: 13px;
    }

    /* Active inline editor highlight */
    .drawio-editor-wrapper.active {}

    /* Inline toolbar (floats above diagram, outside wrapper) */
    .drawio-toolbar-row {
      position: absolute;
      top: -32px;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: flex-end;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      /* don't steal mouseenter from the sibling above */
    }

    .drawio-editor-outer.toolbar-visible .drawio-toolbar-row {
      opacity: 0.8;
      pointer-events: auto;
      /* re-enable once this container's toolbar is shown */
    }

    .drawio-toolbar-row:hover {
      opacity: 1 !important;
    }

    .drawio-inline-toolbar {
      display: flex;
      align-items: center;
      gap: 0;
      border: 1px solid var(--vscode-editorGroup-border);
      border-radius: 4px;
      background: var(--vscode-editor-background);
      overflow: hidden;
    }

    .drawio-inline-toolbar button {
      position: relative;
      width: 28px;
      height: 28px;
      border: none;
      border-right: 1px solid var(--vscode-editorGroup-border);
      background: transparent;
      color: var(--vscode-editor-foreground);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .drawio-inline-toolbar button:last-child {
      border-right: none;
    }

    .drawio-inline-toolbar button:hover {
      background: var(--vscode-button-background);
      color: var(--vscode-button-foreground);
    }

    .drawio-inline-toolbar button svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .drawio-inline-toolbar button[title]::after {
      content: attr(title);
      position: absolute;
      top: calc(100% + 4px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--vscode-editorWidget-background, #252526);
      color: var(--vscode-editorWidget-foreground, #ccc);
      border: 1px solid var(--vscode-editorWidget-border, #454545);
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease 0.5s;
      z-index: 100;
    }

    .drawio-inline-toolbar button[title]:hover::after {
      opacity: 1;
    }

    /* ── Resize handles ── */
    .drawio-resize-handle {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 12px;
      cursor: ns-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      background: transparent;
      scroll-margin: 40px;
    }

    .drawio-resize-handle::after {
      content: '';
      width: 40px;
      height: 4px;
      background: var(--vscode-editorGroup-border);
      border-radius: 2px;
      opacity: 0.5;
    }

    .drawio-resize-handle:hover::after {
      opacity: 1;
    }

    /* Hide resize handles when editor is not active */
    .drawio-editor-wrapper:not(.active)>.drawio-resize-handle,
    .drawio-editor-wrapper:not(.active)>.drawio-corner-resize-handle {
      pointer-events: none;
      visibility: hidden;
    }

    .drawio-corner-resize-handle {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      z-index: 6;
      background: transparent;
      scroll-margin: 40px;
    }

    .drawio-corner-resize-handle::after {
      content: '';
      position: absolute;
      bottom: 3px;
      right: 3px;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--vscode-editorGroup-border);
      border-bottom: 2px solid var(--vscode-editorGroup-border);
      opacity: 0.5;
    }

    .drawio-corner-resize-handle:hover::after {
      opacity: 1;
    }

    /* ── Locked diagram ── */
    .drawio-locked-container {
      position: relative;
      border: 1px solid var(--vscode-editorGroup-border);
      border-radius: 4px;
      overflow: hidden;
      background: var(--vscode-editor-background);
      min-height: 80px;
    }

    /* ── Mermaid block ── */
    .drawio-mermaid-container {
      position: relative;
      border: 1px solid var(--vscode-editorGroup-border);
      border-radius: 4px;
      overflow: hidden;
      background: var(--vscode-textCodeBlock-background);
    }

    .drawio-mermaid-container pre {
      margin: 0;
      padding: 12px 16px;
      font-family: var(--vscode-editor-font-family, monospace);
      font-size: var(--vscode-editor-font-size, 13px);
      line-height: 1.4;
      color: var(--vscode-editor-foreground);
      white-space: pre;
      overflow-x: auto;
    }

    .drawio-mermaid-container pre code {
      background: none;
      padding: 0;
    }

    .drawio-mermaid-label {
      display: inline-block;
      padding: 2px 8px;
      font-size: 11px;
      color: var(--vscode-descriptionForeground);
      background: var(--vscode-badge-background, rgba(128, 128, 128, 0.15));
      border-radius: 3px;
      margin-left: 16px;
      margin-top: 8px;
    }

    /* ── Viewport overlay (Quip-style full editor) ── */
    #editor-overlay {
      display: none;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10000;
      background: var(--vscode-editor-background);
      flex-direction: column;
    }

    #editor-overlay.active {
      display: flex;
    }

    #editor-overlay iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ── Lightbox overlay (read-only full-window diagram view) ── */
    #lightbox-overlay {
      display: none;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10000;
      background: var(--vscode-editor-background);
      flex-direction: column;
    }

    #lightbox-overlay.active {
      display: flex;
    }

    #lightbox-overlay .lightbox-toolbar {
      display: flex;
      align-items: center;
      padding: 0 50px;
      gap: 8px;
      height: 36px;
      background: var(--vscode-editorGroupHeader-tabsBackground, var(--vscode-editor-background));
      border-bottom: 1px solid var(--vscode-editorGroup-border);
      flex-shrink: 0;
    }

    #lightbox-overlay .lightbox-toolbar .lightbox-spacer {
      flex: 1;
    }

    #lightbox-overlay .lightbox-toolbar button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 28px;
      padding: 0 12px;
      border: 1px solid var(--vscode-button-border, var(--vscode-editorGroup-border));
      border-radius: 4px;
      background: var(--vscode-button-secondaryBackground, transparent);
      color: var(--vscode-button-secondaryForeground, var(--vscode-editor-foreground));
      font-size: 12px;
      cursor: pointer;
    }

    #lightbox-overlay .lightbox-toolbar button:hover {
      background: var(--vscode-button-secondaryHoverBackground, rgba(128, 128, 128, 0.15));
    }

    #lightbox-overlay .lightbox-toolbar button svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    #lightbox-overlay iframe {
      flex: 1;
      width: 100%;
      border: none;
    }

    #lightbox-loading {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--vscode-descriptionForeground, #888);
      font-family: var(--vscode-font-family, sans-serif);
      font-size: 14px;
      pointer-events: none;
    }

    #lightbox-loading.hidden {
      display: none;
    }

  </style>
</head>

<body>
  <div id="toolbar">
    <button id="btn-insert">+ Diagram</button>
    <div class="spacer"></div>
    <button id="btn-refresh" title="Reload page">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6" />
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
        <path d="M3 22v-6h6" />
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
      </svg>
    </button>
  </div>
  <div id="markdown-content"></div>

  <!-- Viewport overlay for full-screen diagram editing (Quip-style) -->
  <div id="editor-overlay">
    <iframe id="editor-overlay-frame"></iframe>
  </div>

  <!-- Lightbox overlay for non-editable full-window diagram view -->
  <div id="lightbox-overlay">
    <div class="lightbox-toolbar">
      <button id="lightbox-zoom-in" title="Zoom in">
        <svg viewBox="0 0 16 16">
          <path
            d="M7 1a6 6 0 1 0 3.5 10.9l3.3 3.3a.75.75 0 1 0 1.06-1.06l-3.3-3.3A6 6 0 0 0 7 1ZM2.5 7a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM7 4a.75.75 0 0 1 .75.75v1.5h1.5a.75.75 0 0 1 0 1.5h-1.5v1.5a.75.75 0 0 1-1.5 0v-1.5h-1.5a.75.75 0 0 1 0-1.5h1.5v-1.5A.75.75 0 0 1 7 4Z" />
        </svg>
      </button>
      <button id="lightbox-zoom-out" title="Zoom out">
        <svg viewBox="0 0 16 16">
          <path
            d="M7 1a6 6 0 1 0 3.5 10.9l3.3 3.3a.75.75 0 1 0 1.06-1.06l-3.3-3.3A6 6 0 0 0 7 1ZM2.5 7a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM4.25 6.25a.75.75 0 0 0 0 1.5h5.5a.75.75 0 0 0 0-1.5h-5.5Z" />
        </svg>
      </button>
      <button id="lightbox-fit" title="Fit to window">
        <svg viewBox="0 0 16 16">
          <path
            d="M2 2.5A.5.5 0 0 1 2.5 2h3a.5.5 0 0 1 0 1H3v2.5a.5.5 0 0 1-1 0v-3Zm0 11a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 0-1H3v-2.5a.5.5 0 0 0-1 0v3Zm12 0a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1 0-1H13v-2.5a.5.5 0 0 1 1 0v3Zm0-11a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0 0 1H13v2.5a.5.5 0 0 0 1 0v-3Z" />
        </svg>
      </button>
      <div class="lightbox-spacer"></div>
      <button id="lightbox-close-btn" class="lightbox-close" title="Close (Esc)">
        <svg viewBox="0 0 16 16">
          <path
            d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z" />
        </svg>
        Close
      </button>
    </div>
    <div id="lightbox-loading">Loading diagram…</div>
    <iframe id="lightbox-frame"></iframe>
  </div>

  <script nonce="${nonce}">
    (function () {
      var vscode = acquireVsCodeApi();

      // Editable image links can be .drawio.svg or .drawio.png; pick draw.io's
      // export format accordingly (xmlpng embeds the XML in a PNG tEXt chunk,
      // xmlsvg in the <svg content="..."> attribute).
      function linkExportFormat(target) {
        return /\.drawio\.png(?:[?#]|$)/i.test(target || '') ? 'xmlpng' : 'xmlsvg';
      }

      // Forward intercepted VS Code shortcuts from draw.io iframes.
      // This is a dedicated listener that doesn't depend on iframe source
      // matching, because VS Code's webview iframe nesting can make
      // evt.source !== iframe.contentWindow.
      window.addEventListener('message', function(evt) {
        var d = evt.data;
        // Object message from the offline injected keyboard script.
        if (d && typeof d === 'object' && d.type === 'vscodeShortcut' && d.command) {
          console.log('[inlinePreview] relaying vscodeShortcut to extension:', d.command);
          vscode.postMessage({ type: 'vscodeShortcut', command: d.command });
          return;
        }
        // Stringified message from draw.io's native embed passthrough (online /
        // cross-origin iframe, where we cannot inject): {event:'shortcut', command}.
        if (typeof d === 'string' && d.indexOf('"shortcut"') !== -1) {
          try {
            var m = JSON.parse(d);
            if (m && m.event === 'shortcut' && m.command) {
              console.log('[inlinePreview] relaying drawio shortcut to extension:', m.command);
              vscode.postMessage({ type: 'vscodeShortcut', command: m.command });
            }
          } catch (e) {}
        }
        // Link click forwarded by draw.io ({event:'openLink', href}) — hand it to
        // the extension to open in the OS browser. draw.io's embed override posts
        // a JSON string, but handle an object form too for robustness.
        var linkMsg = null;
        if (d && typeof d === 'object' && d.event === 'openLink') {
          linkMsg = d;
        } else if (typeof d === 'string' && d.indexOf('"openLink"') !== -1) {
          try { linkMsg = JSON.parse(d); } catch (e) {}
        }
        if (linkMsg && linkMsg.event === 'openLink' && linkMsg.href) {
          console.log('[inlinePreview] relaying openLink to extension:', linkMsg.href);
          vscode.postMessage({ type: 'openLink', href: linkMsg.href });
        }
      });

      var contentEl = document.getElementById('markdown-content');
      var btnInsert = document.getElementById('btn-insert');
      var btnRefresh = document.getElementById('btn-refresh');

      // Overlay elements
      var overlayEl = document.getElementById('editor-overlay');
      var overlayFrame = document.getElementById('editor-overlay-frame');

      // Lightbox elements
      var lightboxEl = document.getElementById('lightbox-overlay');
      var lightboxFrame = document.getElementById('lightbox-frame');
      var lightboxLoading = document.getElementById('lightbox-loading');
      document.getElementById('lightbox-close-btn').addEventListener('click', closeLightbox);
      document.getElementById('lightbox-zoom-in').addEventListener('click', function () {
        if (lightboxState.initialized)
          lightboxFrame.contentWindow.postMessage(JSON.stringify({ action: 'invokeAction', actionName: 'zoomIn' }), '*');
      });
      document.getElementById('lightbox-zoom-out').addEventListener('click', function () {
        if (lightboxState.initialized)
          lightboxFrame.contentWindow.postMessage(JSON.stringify({ action: 'invokeAction', actionName: 'zoomOut' }), '*');
      });
      document.getElementById('lightbox-fit').addEventListener('click', function () {
        if (lightboxState.initialized)
          lightboxFrame.contentWindow.postMessage(JSON.stringify({ action: 'invokeAction', actionName: 'smartFit' }), '*');
      });

      // ── Configuration ──
      var DIAGRAM_SAVE_DEBOUNCE_MS = 500;
      var TEXT_SAVE_DEBOUNCE_MS = 1000;

      // ── State ──
      var editorUrl = 'http://localhost:8888';
      var uiTheme = 'kennedy'; // draw.io UI theme for the full (overlay) editor; set via setEditorUrl
      var drawioLang = 'en'; // draw.io UI language (matches VS Code locale); set via setEditorUrl
      var drawioUserConfig = {}; // user's draw.io config (styles/fonts/defaults); set via setDrawioConfig
      var devMode = true;
      var isDark = document.body.classList.contains('vscode-dark');
      var minimalUI = true;
      var diagramPadding = 28;

      var imageBaseUri = '';
      var diagramBlocks = [];
      var mermaidCount = 0;

      // Returns true if the XML has no actual shapes (only the two root mxCells).
      function isBlankDiagramXml(xml) {
        if (!xml) return true;
        var cells = xml.match(/<mxCell\b/g);
        return !cells || cells.length <= 2;
      }
      var editorStates = new Map(); // blockIndex -> EditorState
      var textSections = [];

                preserveViewState: true,
                settingsName: 'vscode-overlay-editor',
                useInternalClipboard: true
              })
            }), '*');
            break;

          case 'init':
            overlayState.initialized = true;
            overlayFrame.contentWindow.postMessage(JSON.stringify({
              action: 'load',
              autosave: 1,
              xml: overlayState.currentXml,
              title: '',
            }), '*');
            break;

          case 'load':
            break;

          case 'export':
            // Editable image-link save from the overlay editor: draw.io answers the
            // 'xmlsvg' export request with an 'svg'-format response carrying the full
            // editable SVG; forward it to the extension to write the linked file.
            if (overlayState._pendingLinkSave && (msg.format == 'svg' || msg.format == 'xmlpng')) {
              overlayState._pendingLinkSave = false;
              if (overlayState.linkTarget && msg.data) {
                vscode.postMessage({ type: 'diagramLinkEdited', target: overlayState.linkTarget, svg: msg.data });
              }
            }
            break;

          case 'autosave':
            // Track changes in memory but do NOT save to file
            if (msg.xml) {
              overlayState.currentXml = msg.xml;
              if (!overlayState.dirty) {
                overlayState.dirty = true;
                overlayFrame.contentWindow.postMessage(JSON.stringify({
                  action: 'status',
                  messageKey: 'unsavedChanges',
                  modified: true
                }), '*');
              }
            }
            if (msg.modelBounds) overlayState.modelBounds = msg.modelBounds;
            break;

          case 'save':
            // Explicit save by user (Ctrl+S) — write to file
            if (msg.xml) {
              overlayState.currentXml = msg.xml;
              if (!overlayState.dirty) {
                overlayState.dirty = true;
              }
            }
            if (msg.modelBounds) overlayState.modelBounds = msg.modelBounds;
            if (msg.exit) {
              closeOverlay();
            }
            else {
              // Save to file immediately
              saveOverlayToFile();
            }
            break;

          case 'exit':
            closeOverlay();
            break;
        }
      }

      // ──────────────────────────────────────────────────────────────
      // Scroll to a diagram and open its full overlay editor
      // ──────────────────────────────────────────────────────────────
      function scrollToAndEditDiagram(blockIndex, isNew) {
        var state = editorStates.get(blockIndex);
        if (!state || !state.wrapper) {
          // Content not rendered yet — queue for after render completes
          _pendingScrollToBlock = blockIndex;
          _pendingScrollIsNew = !!isNew;
          return;
        }

        _pendingScrollToBlock = null;
        _pendingScrollIsNew = false;
        if (isNew) state._needsTemplatePicker = true;
        // Defer scroll until after layout so element positions are final
        requestAnimationFrame(function () {
          var s = editorStates.get(blockIndex);
          if (s && s.wrapper) {
            allowScrollBriefly(1500);
            s.wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
            singletonAttach(s);
          }
        });
      }

      // ──────────────────────────────────────────────────────────────
      // Overlay management (Quip-style viewport-level full editor)
      // ──────────────────────────────────────────────────────────────
      function openOverlay(blockIndex) {
        var state = editorStates.get(blockIndex);
        if (!state) return;

        // Flush any pending inline edits first
        if (state.dirty) flushDiagramSave(state);

        overlayState.active = true;
        overlayState.blockIndex = blockIndex;
        overlayState.currentXml = state.currentXml;
        overlayState.diagramId = state.diagramId;
        overlayState.linkTarget = (diagramBlocks[blockIndex] && diagramBlocks[blockIndex].linkTarget) || null;
        overlayState.dirty = false;
        overlayState.modelBounds = null;

        overlayEl.classList.add('active');

        // Full UI URL — uses the configured draw.io theme (same as the standalone
        // editor); saveAndExit=1 adds draw.io's built-in "Save & Exit" button.
        var params = 'embed=1&proto=json&spin=1&configure=1&libraries=1&tooltips=0'
          + '&saveAndExit=1&ui=' + encodeURIComponent(uiTheme)
          + '&lang=' + encodeURIComponent(drawioLang);
        if (devMode) params += '&dev=1&test=1';
        if (window.innerWidth < 1200) params += '&format=0&sidebar=0';
        params += '&dark=auto';
        var url = withEmbedParams(editorUrl, params);

        if (overlayState.initialized && overlayFrame.src && overlayFrame.src.indexOf(editorUrl) >= 0) {
          // Reuse existing iframe
          overlayFrame.contentWindow.postMessage(JSON.stringify({
            action: 'load',
            autosave: 1,
            xml: overlayState.currentXml,
            title: '',
          }), '*');
        }
        else {
          overlayState.initialized = false;
          overlayFrame.src = url;
        }

        document.body.style.overflow = 'hidden';
      }

      // Save overlay diagram to file and update inline preview
      function saveOverlayToFile() {
        var state = editorStates.get(overlayState.blockIndex);
        if (!state) return;

        state.currentXml = overlayState.currentXml;

        // Use model-space bounds from the overlay editor if available —
        // these are authoritative and reflect the latest edits.
        if (overlayState.modelBounds) {
          state.diagramBounds = overlayState.modelBounds;
        }

        // Update the inline editor if it exists
        if (state.iframe && state.initialized) {
          state.iframe.contentWindow.postMessage(JSON.stringify({
            action: 'load',
            autosave: 1,
            xml: state.currentXml,
            title: 'Diagram',
            border: diagramPadding, fit: 1, maxFitScale: 1
          }), '*');
        }
        // Update SVG preview
        if (state.previewLayer) {
          var newBounds = renderSvgPreview(state.previewLayer, state.currentXml);
          if (newBounds) state.diagramBounds = newBounds;
        }

        // Save to file. For an editable image link, write the linked .drawio.svg/.png
        // via an export from the overlay editor (mirrors the inline flushDiagramSave
        // path); otherwise edit the markdown codeblock.
        if (overlayState.linkTarget) {
          overlayState._pendingLinkSave = true;
          state._linkSaveQuietUntil = Date.now() + 2000;
          overlayFrame.contentWindow.postMessage(JSON.stringify({ action: 'export', format: linkExportFormat(overlayState.linkTarget) }), '*');
        }
        else {
          vscode.postMessage({
            type: 'diagramEdited',
            blockIndex: overlayState.blockIndex,
            xml: overlayState.currentXml,
            diagramId: overlayState.diagramId,
          });
        }

        overlayState.dirty = false;
        overlayFrame.contentWindow.postMessage(JSON.stringify({
          action: 'status',
          messageKey: 'allChangesSaved',
          modified: false
        }), '*');
      }

      function closeOverlay() {
        if (!overlayState.active) return;

        var savedBlockIndex = overlayState.blockIndex;

        // Save any unsaved changes before closing
        if (overlayState.dirty) {
          saveOverlayToFile();
        }

        overlayState.active = false;
        overlayState.blockIndex = -1;
        overlayState.dirty = false;
        overlayEl.classList.remove('active');
        document.body.style.overflow = '';

        // Implicit fit after closing the overlay editor — re-size container to
        // match the (potentially edited) diagram with maxScale=1 semantics.
        // Use _doFitDiagramToContainer directly because state already has fresh
        // XML and bounds from the overlay, and the singleton may be mid-reload.
        var state = editorStates.get(savedBlockIndex);
        if (state) _doFitDiagramToContainer(state, true);
      }

      // ──────────────────────────────────────────────────────────────
      // Lightbox messages (read-only iframe — ignore edit events)
      // ──────────────────────────────────────────────────────────────
      function handleLightboxMessage(msg) {
        switch (msg.event) {
          case 'configure':
            lightboxFrame.contentWindow.postMessage(JSON.stringify({
              action: 'configure',
              config: {
                compact: true,
                css: LIGHTBOX_CSS,
                darkColor: '#1e1e1e',
                settingsName: 'vscode-lightbox',
                noAutoFocus: true,
                noResizers: true,
              }
            }), '*');
            break;

          case 'init':
            lightboxLoading.classList.add('hidden');
            lightboxState.initialized = true;
            lightboxFrame.contentWindow.postMessage(JSON.stringify({
              action: 'load',
              autosave: 0,
              xml: lightboxState.currentXml,
              title: '',
            }), '*');
            break;

          case 'load':
            break;

          // Ignore edit events — lightbox is read-only
          case 'autosave':
          case 'save':
          case 'exit':
            break;
        }
      }

      // ──────────────────────────────────────────────────────────────
      // Lightbox management (non-editable full-window diagram view)
      // ──────────────────────────────────────────────────────────────
      function openLightbox(xml) {
        if (!xml || !xml.trim()) return;

        lightboxState.active = true;
        lightboxState.currentXml = xml;
        lightboxEl.classList.add('active');
        document.body.style.overflow = 'hidden';

        var params = 'lightbox=1&toolbar=0&configure=1&embed=1&tooltips=0'
          + '&proto=json&spin=1&pv=0&grid=0&transparent=1&border=60'
          + '&lang=' + encodeURIComponent(drawioLang);
        if (devMode) params += '&dev=1&test=1';
        if (isDark) params += '&dark=1';
        var url = withEmbedParams(editorUrl, params);

        if (lightboxState.initialized && lightboxFrame.src && lightboxFrame.src.indexOf(editorUrl) >= 0) {
          // Reuse existing iframe — no loading needed
          lightboxLoading.classList.add('hidden');
          lightboxFrame.contentWindow.postMessage(JSON.stringify({
            action: 'load',
            autosave: 0,
            xml: lightboxState.currentXml,
            title: '',
          }), '*');
        }
        else {
          // Fresh load — show loading message
          lightboxLoading.classList.remove('hidden');
          lightboxState.initialized = false;
          lightboxFrame.src = url;
        }
      }

      function closeLightbox() {
        lightboxState.active = false;
        lightboxEl.classList.remove('active');
        if (!overlayState.active) document.body.style.overflow = '';
      }

      // ──────────────────────────────────────────────────────────────
      // Override GraphViewer dark-mode colors to use VS Code theme variables
      // instead of the hardcoded #121212.  Must run before any GraphViewer
      // instance is created (initCss bakes darkBackgroundColor into a <style>).
      var _graphViewerDarkConfigured = false;
      function ensureGraphViewerDarkConfig() {
        if (_graphViewerDarkConfigured || typeof GraphViewer === 'undefined') return;
        _graphViewerDarkConfigured = true;
        GraphViewer.darkBackgroundColor = 'var(--vscode-editor-background)';
        document.documentElement.style.setProperty('--ge-dark-color',
          'var(--vscode-editor-background)');
      }

      // ──────────────────────────────────────────────────────────────
      // SVG Preview rendering using GraphViewer.
      // Returns the mxGraph-rendered bounds { width, height } extracted from
      // the SVG viewBox, or null if rendering failed. These bounds are more
      // accurate than getBoundsFromXml() because mxGraph accounts for edge
      // routing, labels, and other elements that extend beyond mxGeometry.
      function renderSvgPreview(container, xml) {
        // GraphViewer sets inline styles (padding, overflow, etc.) on the
        // container.  When re-rendering after the container was display:none
        // (while the singleton iframe was active), these stale inline styles
        // can cause the absolutely-positioned container to collapse to its
        // padding width (e.g. 57px = 2×28px padding + 1px min-width).
        // Reset inline styles so the CSS class rules (width:100%, etc.) apply.
        container.removeAttribute('style');
        container.innerHTML = '';

        if (!xml || !xml.trim()) {
          container.innerHTML = '<div class="preview-empty">Empty diagram</div>';
          return null;
        }

        try {
          if (typeof GraphViewer !== 'undefined') {
            ensureGraphViewerDarkConfig();

            // GraphViewer applies border as fixed-pixel CSS padding on the
            // container, matching graph.fit(border) in the inline editor.
            var config = {
              highlight: '#0000ff',
              responsive: true,
              lightbox: false,
              nav: false,
              border: diagramPadding
            };

            config['responsive-max-scale'] = 1;
            config['dark-mode'] = 'auto';

            var xmlDoc = mxUtils.parseXml(xml);
            new GraphViewer(container, xmlDoc.documentElement, config);

            // Extract actual rendered bounds from the SVG viewBox.
            // viewBox = (x, y, graphW+1, graphH+1) — border is CSS padding, not in viewBox
            var svgEl = container.querySelector('svg');
            if (svgEl) {
              var vb = svgEl.getAttribute('viewBox');
              var renderedBounds = null;

              if (vb) {
                var vbParts = vb.split(/[\s,]+/).map(Number);
                if (vbParts.length === 4 && vbParts[2] > 0) {
                  // Reverse the viewBox formula to get graph bounds
                  renderedBounds = {
                    width: vbParts[2] - 1,
                    height: vbParts[3] - 1
                  };
                }
              }

              // Empty diagram (valid XML but no visible shapes) — show placeholder
              // viewBox "0 0 1 1" produces bounds {width:0, height:0} for empty diagrams
              if (!renderedBounds || (renderedBounds.width <= 0 && renderedBounds.height <= 0)) {
                container.removeAttribute('style');
                container.innerHTML = '<div class="preview-empty">Empty diagram</div>';
                return null;
              }

              return renderedBounds;
            }
            else {
              // GraphViewer produced no SVG — show placeholder
              container.removeAttribute('style');
              container.innerHTML = '<div class="preview-empty">Empty diagram</div>';
              return null;
            }
          }
          else {
            container.innerHTML = '<div class="preview-loading">Rendering...</div>';
          }
        }
        catch (e) {
          container.innerHTML = '<div class="preview-loading" style="color:var(--vscode-errorForeground)">Preview error</div>';
        }
        return null;
      }

      // ──────────────────────────────────────────────────────────────
      // Content rendering
      // ──────────────────────────────────────────────────────────────
      function renderContent(sections) {
        if (!sections || !sections.length) return;
        if (editorStates.size > 0) {
          if (tryIncrementalUpdate(sections)) {
            return;
          }
        }

        fullRender(sections);
      }

      function fullRender(sections) {
        cleanupAllEditors();
        contentEl.innerHTML = '';
        diagramBlocks = [];
        mermaidCount = sections.filter(function (s) { return s.type === 'mermaid'; }).length;
        textSections = [];
        _lastInteractedEndLine = null;

        for (var i = 0; i < sections.length; i++) {
          var section = sections[i];

          if (section.type === 'text') {
            renderTextSection(section);
          }
          else if (section.type === 'diagram') {
            diagramBlocks[section.blockIndex] = section;
            var ph = document.createElement('div');
            ph.className = 'drawio-inline-placeholder';
            ph.setAttribute('data-block-index', section.blockIndex);
            contentEl.appendChild(ph);
            renderDiagramBlock(ph, section.blockIndex);
          }
          else if (section.type === 'mermaid') {
            renderMermaidBlock(section);
          }
        }

        startFocusPolling();
        setupLazyLoading();

        // After all content is rendered, a scrollbar may have appeared, changing
        // the available width. Schedule a refit pass so diagram heights match
        // what the fit button would compute with the current layout.
        requestAnimationFrame(function () {
          editorStates.forEach(function (st) {
            if (st.explicitWidth || st.explicitHeight) return;
            var outerEl = st.wrapper.parentElement;
            if (!outerEl || !st.diagramBounds) return;

            var availW = outerEl.parentElement ? outerEl.parentElement.clientWidth : outerEl.clientWidth;
            var wrapperCS = window.getComputedStyle(st.wrapper);
            var wrapperChrome = (parseFloat(wrapperCS.borderLeftWidth) || 0) +
              (parseFloat(wrapperCS.borderRightWidth) || 0) +
              (parseFloat(wrapperCS.paddingLeft) || 0) +
              (parseFloat(wrapperCS.paddingRight) || 0);

            var fitSize = calcFitSize(st.diagramBounds, availW, wrapperChrome);
            outerEl.style.width = fitSize.width + 'px';

            // Use measurement-based height for consistency with fitDiagramToContainer
            var resizeBar = 12;
            var targetH = fitSize.height;
            var svgEl = st.previewLayer ? st.previewLayer.querySelector('svg') : null;
            if (svgEl) {
              var svgRect = svgEl.getBoundingClientRect();
              var layerRect = st.previewLayer.getBoundingClientRect();
              var svgTop = svgRect.top - layerRect.top;
              targetH = Math.max(20, Math.ceil(svgTop + svgRect.height + diagramPadding + resizeBar));
            }

            var currentH = parseInt(st.wrapper.style.height, 10);
            if (currentH !== targetH) {
              st.wrapper.style.height = targetH + 'px';
            }
          });

          // Flush any pending scroll-to-block that arrived before/during render
          if (_pendingScrollToBlock != null) {
            var idx = _pendingScrollToBlock;
            var isNew = _pendingScrollIsNew;
            _pendingScrollToBlock = null;
            _pendingScrollIsNew = false;
            var s = editorStates.get(idx);
            if (s && s.wrapper) {
              if (isNew) s._needsTemplatePicker = true;
              allowScrollBriefly(1500);
              s.wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
              singletonAttach(s);
            }
          }
        });
      }

      function tryIncrementalUpdate(sections) {
        var newMermaidCount = sections.filter(function (s) { return s.type === 'mermaid'; }).length;
        if (newMermaidCount !== mermaidCount) return false;

        var newDiagrams = sections.filter(function (s) { return s.type === 'diagram'; });
        if (newDiagrams.length !== diagramBlocks.length) return false;

        for (var i = 0; i < newDiagrams.length; i++) {
          var nd = newDiagrams[i];
          var od = diagramBlocks[nd.blockIndex];
          if (!od) return false;
          if (nd.locked !== od.locked) return false;
          if (nd.diagramId !== od.diagramId) return false;
        }

        for (var i = 0; i < newDiagrams.length; i++) {
          var nd = newDiagrams[i];
          var state = editorStates.get(nd.blockIndex);
          // A linked .drawio.svg/.png editor that is mid-save or just-saved is authoritative:
          // sendContent re-reads the file from disk, which can lag the live edits, so
          // keep the live xml and don't merge/load that (stale) disk content back in.
          var linkBusy = !!(nd.linkTarget && state &&
            (state._pendingLinkSave || (state._linkSaveQuietUntil || 0) > Date.now()));
          if (linkBusy) { nd = Object.assign({}, nd, { xml: state.currentXml }); }
          var externallyChanged = false;
          if (state && state.iframe && state.initialized) {
            if (state.currentXml !== nd.xml) {
              if (state.dirty) {
                // Merge external changes to preserve unsaved inline edits;
                // the merged result will come back via autosave
                state.iframe.contentWindow.postMessage(JSON.stringify({
                  action: 'merge',
                  xml: nd.xml
                }), '*');
              }
              else {
                state.currentXml = nd.xml;
                state.iframe.contentWindow.postMessage(JSON.stringify({
                  action: 'load', autosave: 1, xml: nd.xml, title: '',
                  border: diagramPadding, fit: 1, maxFitScale: 1
                }), '*');
              }
              externallyChanged = true;
            }
          }
          else if (state && state.previewLayer) {
            if (state.currentXml !== nd.xml) {
              state.currentXml = nd.xml;
              var newBounds = renderSvgPreview(state.previewLayer, nd.xml);
              if (newBounds) state.diagramBounds = newBounds;
              externallyChanged = true;
            }
          }

          // A linked .drawio.svg/.png changed externally: resize the viewer so the
          // complete (possibly larger) diagram stays fully visible. fitDiagramToContainer
          // exports the fresh post-merge/load bounds for an active editor (or sizes the
          // preview directly), fitting both width and height to the new content.
          if (externallyChanged && state && nd.linkTarget) {
            fitDiagramToContainer(state, false);
          }

          // Merge external changes into the open overlay editor
          if (!linkBusy && overlayState.active && overlayState.blockIndex === nd.blockIndex
            && overlayState.initialized && nd.xml !== overlayState.currentXml) {
            overlayFrame.contentWindow.postMessage(JSON.stringify({
              action: 'merge',
              xml: nd.xml
            }), '*');
          }

          diagramBlocks[nd.blockIndex] = nd;
        }

        var newTexts = sections.filter(function (s) { return s.type === 'text'; });
        if (newTexts.length !== textSections.length) return false;
        for (var i = 0; i < newTexts.length; i++) {
          var ts = textSections[i];
          var el = ts.element;
          if (el === document.activeElement || el.contains(document.activeElement)) {
            ts.startLine = newTexts[i].startLine;
            ts.endLine = newTexts[i].endLine;
            continue;
          }
          el.innerHTML = newTexts[i].html;
          ts.startLine = newTexts[i].startLine;
          ts.endLine = newTexts[i].endLine;
        }

        return true;
      }

      // ── Text section rendering ──
      function renderTextSection(section) {
        var div = document.createElement('div');
        div.className = 'text-section';
        div.setAttribute('contenteditable', 'true');
        div.setAttribute('data-start-line', section.startLine);
        div.setAttribute('data-end-line', section.endLine);
        div.innerHTML = section.html;
        contentEl.appendChild(div);

        var sectionInfo = { element: div, startLine: section.startLine, endLine: section.endLine };
        textSections.push(sectionInfo);
        div.addEventListener('input', function () { debouncedTextSave(sectionInfo); });
        // Track last interacted section for "+ Diagram" insertion position
        function trackTextInteraction() { _lastInteractedEndLine = sectionInfo.endLine; }
        div.addEventListener('click', trackTextInteraction);
        div.addEventListener('focus', trackTextInteraction);
        div.addEventListener('keydown', trackTextInteraction);
      }

      // ── Diagram block rendering ──
      function renderDiagramBlock(placeholder, index) {
        var block = diagramBlocks[index];
        if (!block) return;

        if (block.locked) {
          renderLockedDiagram(placeholder, block, index);
        }
        else {
          renderEditorDiagram(placeholder, block, index);
        }
      }

      // ── Locked diagrams ──
      function renderLockedDiagram(placeholder, block, index) {
        var outer = document.createElement('div');
        outer.className = 'drawio-editor-outer';

        // Toolbar row (same style as editor, with lock icon instead of expand)
        var toolbarRow = document.createElement('div');
        toolbarRow.className = 'drawio-toolbar-row';

        var inlineToolbar = document.createElement('div');
        inlineToolbar.className = 'drawio-inline-toolbar';

        var lightboxBtn = document.createElement('button');
        lightboxBtn.title = 'Preview';
        lightboxBtn.innerHTML = '<svg viewBox="0 0 16 16"><path d="M8 3.5C4.136 3.5 1.093 6.314.158 7.7a.75.75 0 0 0 0 .6C1.093 9.686 4.136 12.5 8 12.5s6.907-2.814 7.842-4.2a.75.75 0 0 0 0-.6C14.907 6.314 11.864 3.5 8 3.5ZM8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Zm0-1.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/></svg>';
        lightboxBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          openLightbox(block.xml);
        });
        inlineToolbar.appendChild(lightboxBtn);

        var lockBtn = document.createElement('button');
        lockBtn.title = 'Locked';
        lockBtn.innerHTML = '<svg viewBox="0 0 16 16"><path d="M8 1a3.5 3.5 0 0 0-3.5 3.5V6H4a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-.5V4.5A3.5 3.5 0 0 0 8 1Zm2 5H6V4.5a2 2 0 1 1 4 0V6Z"/></svg>';
        lockBtn.style.cursor = 'default';
        lockBtn.style.opacity = '0.6';
        inlineToolbar.appendChild(lockBtn);

        toolbarRow.appendChild(inlineToolbar);
        outer.appendChild(toolbarRow);

        var container = document.createElement('div');
        container.className = 'drawio-locked-container';
        container.setAttribute('data-block-index', index);

        var viewerDiv = document.createElement('div');
        container.appendChild(viewerDiv);

        outer.appendChild(container);
        placeholder.parentNode.replaceChild(outer, placeholder);

        // Track last interacted diagram for "+ Diagram" insertion position
        (function (blk) {
          outer.addEventListener('click', function () { _lastInteractedEndLine = blk.endLine; });
          outer.addEventListener('mousedown', function () { _lastInteractedEndLine = blk.endLine; });
        })(block);

        // Toolbar visibility on hover (same as unlocked diagrams)
        outer.addEventListener('mouseenter', function () { showToolbarFor(outer); });
        outer.addEventListener('mouseleave', function () { scheduleToolbarHide(); });

        try {
          if (typeof GraphViewer !== 'undefined') {
            ensureGraphViewerDarkConfig();

            var config = {
              highlight: '#0000ff',
              responsive: true,
              lightbox: false,
              nav: false,
              border: diagramPadding
            };

            config['responsive-max-scale'] = 1;
            config['dark-mode'] = 'auto';

            var xmlDoc = mxUtils.parseXml(block.xml);
            new GraphViewer(viewerDiv, xmlDoc.documentElement, config);

            // Compute fit width from rendered SVG bounds (same as unlocked previews)
            var svgEl = viewerDiv.querySelector('svg');
            if (svgEl) {
              var vb = svgEl.getAttribute('viewBox');
              if (vb) {
                var vbParts = vb.split(/[\s,]+/).map(Number);
                if (vbParts.length === 4 && vbParts[2] > 0) {
                  var renderedBounds = { width: vbParts[2] - 1, height: vbParts[3] - 1 };
                  var containerCS = window.getComputedStyle(container);
                  var containerChrome = (parseFloat(containerCS.borderLeftWidth) || 0) +
                    (parseFloat(containerCS.borderRightWidth) || 0) +
                    (parseFloat(containerCS.paddingLeft) || 0) +
                    (parseFloat(containerCS.paddingRight) || 0);
                  var availW = outer.parentElement ? outer.parentElement.clientWidth : outer.clientWidth;
                  var fitSize = calcFitSize(renderedBounds, availW, containerChrome);

        // bounds which are more accurate than getBoundsFromXml() (edge labels,
        // routing, etc. can extend beyond mxGeometry elements).

        // Use rendered bounds if available, fall back to XML-parsed bounds

          // diagram after GraphViewer applies scaling + padding.

          if (svgEl) {

            var layerRect = previewLayer.getBoundingClientRect();
            var svgTop = svgRect.top - layerRect.top;
            var resizeBar = 12;
            var measured = Math.max(20, Math.ceil(svgTop + svgRect.height + diagramPadding + resizeBar));
            containerHeight = measured;
          }

        }

        var state = {
          blockIndex: index,
          wrapper: wrapper,
          previewLayer: previewLayer,

          dirty: false,

      // ──────────────────────────────────────────────────────────────
      // Lazy loading – singleton editor attaches on hover
      // ──────────────────────────────────────────────────────────────
      function setupHoverLoad(state) {
        var outer = state.wrapper.parentElement;
        state.wrapper.addEventListener('mouseenter', function () {
          singletonAttach(state);
        });
        // Track mouse over the outer container (includes toolbar row above wrapper)
        if (outer) {
          outer.addEventListener('mouseenter', function () {
            _mouseOverDiagramOuter = true;
          });
          outer.addEventListener('mouseleave', function () {
            _mouseOverDiagramOuter = false;
          });
        }
      }

      function setupLazyLoading() {
        createSingletonIframe();
        editorStates.forEach(function (state) {
          setupHoverLoad(state);
        });
      }

      // ──────────────────────────────────────────────────────────────
      // Focus management
      // ──────────────────────────────────────────────────────────────
      function activateEditor(state) {
        if (state.isActive) return;

        if (activeEditorIndex >= 0) {
          var prevState = editorStates.get(activeEditorIndex);
          if (prevState) {
            prevState.isActive = false;
            prevState.wrapper.classList.remove('active');
          }
        }

        state.isActive = true;
        activeEditorIndex = state.blockIndex;
        state.wrapper.classList.add('active');
      }

      function deactivateEditor(state) {
        if (!state.isActive) return;
        state.isActive = false;
        state.wrapper.classList.remove('active');

        if (activeEditorIndex === state.blockIndex) activeEditorIndex = -1;
        if (state.dirty) flushDiagramSave(state);
      }

      function deactivateAllEditors() {
        editorStates.forEach(function (state) { deactivateEditor(state); });
        activeEditorIndex = -1;
      }

      function startFocusPolling() {
        if (focusPollTimer) clearInterval(focusPollTimer);
        focusPollTimer = setInterval(checkToolbarFocus, 300);
      }

      var _singletonHadFocus = false;

      function checkToolbarFocus() {
        var active = document.activeElement;
        var singletonHasFocus = (active && active === _singletonIframe);

        // Check if focus is on a toolbar button inside the active diagram's
        // outer container.  Clicking toolbar buttons (e.g. fit) briefly moves
        // focus away from the iframe — we should not treat this as a real
        // focus-loss that clears the draw.io selection state.
        var focusInActiveToolbar = false;
        if (!singletonHasFocus && _singletonActiveState && active) {
          var outer = _singletonActiveState.wrapper.parentElement;
          if (outer && outer.contains(active) && active !== _singletonIframe) {
            focusInActiveToolbar = true;
          }
        }

        // When the singleton iframe loses focus, reset the editor UI state
        // — but not when focus merely moved to a toolbar button in the same diagram.
        if (_singletonHadFocus && !singletonHasFocus && !focusInActiveToolbar && _singletonActiveState && _singletonIframe) {
          _singletonIframe.contentWindow.postMessage(JSON.stringify({
            action: 'resetEditor'
          }), '*');
        }

        // When the singleton iframe gains focus, clear any text selection in the page
        if (!_singletonHadFocus && singletonHasFocus) {
          var sel = window.getSelection();
          if (sel) sel.removeAllRanges();
        }

        _singletonHadFocus = singletonHasFocus || focusInActiveToolbar;

        // The .active class (which shows resize handles) is managed by
        // singletonAttach / singletonDetach.  Only deactivate here when
        // no singleton is attached — otherwise the focus poll would
        // remove .active every time the user hasn't clicked the iframe.
        if (!_singletonActiveState) {
          if (active && active.tagName === 'IFRAME') {
            var found = false;
            editorStates.forEach(function (state) {
              if (state.iframe === active) {
                if (!state.isActive) activateEditor(state);
                found = true;
              }
            });
            if (!found && activeEditorIndex >= 0) deactivateAllEditors();
          }
          else {
            if (activeEditorIndex >= 0) deactivateAllEditors();
          }
        }
        else if (focusInActiveToolbar) {
          // Focus is on a toolbar button in the active diagram — return
          // focus to the iframe so the next poll sees it focused again.
          _singletonIframe.focus();
        }
      }

      // ──────────────────────────────────────────────────────────────
      // Diagram autosave debouncing
      // ──────────────────────────────────────────────────────────────
      function debouncedDiagramSave(state) {
        var key = state.blockIndex;
        if (diagramSaveTimers[key]) clearTimeout(diagramSaveTimers[key]);
        diagramSaveTimers[key] = setTimeout(function () {
          delete diagramSaveTimers[key];
          flushDiagramSave(state);
        }, DIAGRAM_SAVE_DEBOUNCE_MS);
      }

      function flushDiagramSave(state) {
        var key = state.blockIndex;
        if (diagramSaveTimers[key]) {
          clearTimeout(diagramSaveTimers[key]);
          delete diagramSaveTimers[key];
        }
        state.dirty = false;

        // Editable image link (![alt](*.drawio.svg|*.drawio.png)): write the linked file, not
        // the markdown. Ask draw.io for the editable SVG (visual + embedded XML);
        // the 'export' handler forwards it to the extension as 'diagramLinkEdited'.
        var linkSec = diagramBlocks[state.blockIndex];
        if (linkSec && linkSec.linkTarget) {
          if (state.iframe && state.initialized) {
            state._pendingLinkSave = true;
            state.iframe.contentWindow.postMessage(JSON.stringify({ action: 'export', format: linkExportFormat(linkSec.linkTarget) }), '*');
          }
          return;
        }

        vscode.postMessage({
          type: 'diagramEdited',
          blockIndex: state.blockIndex,
          xml: state.currentXml,
          diagramId: state.diagramId,
        });
      }

      function flushAllPendingSaves() {
        // Flush overlay
        if (overlayState.active && overlayState.dirty) {
          if (overlayState.linkTarget) {
            overlayState._pendingLinkSave = true;
            overlayFrame.contentWindow.postMessage(JSON.stringify({ action: 'export', format: linkExportFormat(overlayState.linkTarget) }), '*');
          }
          else {
            vscode.postMessage({
              type: 'diagramEdited',
              blockIndex: overlayState.blockIndex,
              xml: overlayState.currentXml,
              diagramId: overlayState.diagramId,
            });
          }
          overlayState.dirty = false;
        }

        // Flush inline editors
        editorStates.forEach(function (state) {
          if (state.dirty) flushDiagramSave(state);
        });
        if (textSaveTimer) {
          clearTimeout(textSaveTimer);
          textSaveTimer = null;
        }
      }

      // ──────────────────────────────────────────────────────────────
      // Text section editing
      // ──────────────────────────────────────────────────────────────
      function debouncedTextSave(sectionInfo) {
        if (textSaveTimer) clearTimeout(textSaveTimer);
        textSaveTimer = setTimeout(function () {
          textSaveTimer = null;
          var markdown = htmlToMarkdown(sectionInfo.element);
          vscode.postMessage({
            type: 'textEdited',
            startLine: sectionInfo.startLine,
            endLine: sectionInfo.endLine,
            markdown: markdown,
          });
        }, TEXT_SAVE_DEBOUNCE_MS);
      }

      // ──────────────────────────────────────────────────────────────
      // Resize handle logic
      // ──────────────────────────────────────────────────────────────

      // During drag-resize, disable pointer-events on ALL iframes so mouse
      // events always reach the parent document.  This covers both the
      // wrapper-internal iframes AND the singleton iframe (which lives in
      // document.body and would otherwise swallow mousemove/mouseup).
      function disableIframePointerEvents(wrapper) {
        var iframes = wrapper.querySelectorAll('iframe');
        for (var i = 0; i < iframes.length; i++) iframes[i].style.pointerEvents = 'none';
        if (_singletonIframe) _singletonIframe.style.pointerEvents = 'none';
      }
      function restoreIframePointerEvents(wrapper) {
        var iframes = wrapper.querySelectorAll('iframe');
        for (var i = 0; i < iframes.length; i++) iframes[i].style.pointerEvents = '';
        if (_singletonIframe && _singletonActiveState) _singletonIframe.style.pointerEvents = 'auto';
      }

      function addResizePadding() {
        document.body.style.paddingBottom = '50vh';
      }

      function removeResizePadding() {

        // scroll position would exceed the new max scroll, the browser
        // clamps it — causing a visible jump.  Compensate by clamping
        // ourselves before removing the padding.
        var beforeScroll = window.scrollY;
        var beforeScrollH = document.body.scrollHeight;
        document.body.style.paddingBottom = '';
        var afterScrollH = document.body.scrollHeight;
        var maxScroll = Math.max(0, afterScrollH - window.innerHeight);
        if (beforeScroll > maxScroll) {
          allowScrollBriefly(100);
          window.scrollTo(window.scrollX, maxScroll);
        }
      }

      // Keep the resize handle visible during drag by scrolling it into view.
      // Uses scroll-margin CSS (40px) to trigger scroll before the handle
      // reaches the viewport edge.  We call this AFTER applyHeight so the
      // handle's bounding rect reflects the new wrapper size.
      // Keep the resize handle visible during drag by scrolling it into view.
      // Returns the number of pixels actually scrolled so the caller can
      // compensate startScroll (our own scroll must not inflate the height).
      var RESIZE_SCROLL_MARGIN = 40; // px buffer before viewport edge
      function scrollHandleIntoView(handle) {
        var rect = handle.getBoundingClientRect();
        var vh = window.innerHeight;
        var beforeY = window.scrollY;
        if (rect.bottom + RESIZE_SCROLL_MARGIN > vh) {
          var overshoot = rect.bottom + RESIZE_SCROLL_MARGIN - vh;
          window.scrollBy(0, overshoot);
        }
        else if (rect.top - RESIZE_SCROLL_MARGIN < 0) {
          var undershoot = rect.top - RESIZE_SCROLL_MARGIN;
          window.scrollBy(0, undershoot);
        }
        return window.scrollY - beforeY;

      function setupResizeHandle(handle, wrapper, blockIndex) {
        var startY = 0, startH = 0, startScroll = 0, dragging = false;

        function applyHeight() {
          var scrollDelta = window.scrollY - startScroll;
          wrapper.style.height = Math.max(20, startH + (_lastClientY - startY) + scrollDelta) + 'px';
          updateSingletonPosition();

        var _lastClientY = 0;

        handle.addEventListener('mousedown', function (e) {
          e.preventDefault();
          dragging = true;
          _resizeDragging = true;
          startY = e.clientY;
          _lastClientY = e.clientY;
          startH = wrapper.offsetHeight;
          startScroll = window.scrollY;
          addResizePadding();
          _scrollAllowed = true;
          disableIframePointerEvents(wrapper);
          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        });

          _lastClientY = e.clientY;
          var scrollDelta = window.scrollY - startScroll;
          var newH = Math.max(20, startH + (_lastClientY - startY) + scrollDelta);
          applyHeight();
          scrollHandleIntoView(handle);
        }

        function onMouseUp() {
          if (!dragging) return;
          dragging = false;
          _resizeDragging = false;
          removeResizePadding();
          _scrollAllowed = false;
          _scrollGuardX = window.scrollX;
          _scrollGuardY = window.scrollY;
          restoreIframePointerEvents(wrapper);
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
          updateSingletonPosition();

          var state = editorStates.get(blockIndex);
          if (state) state.explicitHeight = true;

          var rzLink = diagramBlocks[blockIndex];
          if (!(rzLink && rzLink.linkTarget)) {
            vscode.postMessage({
              type: 'diagramResized',
              blockIndex: blockIndex,
              height: Math.max(20, wrapper.offsetHeight),

      }

      function setupCornerResizeHandle(handle, wrapper, blockIndex) {
        var startX = 0, startY = 0, startW = 0, startH = 0, startScroll = 0, dragging = false;
        var _lastClientY = 0;

        function applySize() {
          var scrollDelta = window.scrollY - startScroll;
          wrapper.style.height = Math.max(20, startH + (_lastClientY - startY) + scrollDelta) + 'px';
          updateSingletonPosition();
        }

        handle.addEventListener('mousedown', function (e) {
          e.preventDefault();
          e.stopPropagation();
          dragging = true;
          _resizeDragging = true;
          startX = e.clientX;
          startY = e.clientY;
          _lastClientY = e.clientY;
          startW = wrapper.offsetWidth;
          startH = wrapper.offsetHeight;
          startScroll = window.scrollY;
          addResizePadding();
          _scrollAllowed = true;
          disableIframePointerEvents(wrapper);
          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        });

        function onMouseMove(e) {
          if (!dragging) return;
          _lastClientY = e.clientY;
          var newW = Math.max(20, startW + (e.clientX - startX));
          wrapper.style.width = newW + 'px';
          if (wrapper.parentElement) wrapper.parentElement.style.width = newW + 'px';
          applySize();
          scrollHandleIntoView(handle);
        }

        function onMouseUp() {
          if (!dragging) return;
          dragging = false;
          _resizeDragging = false;
          removeResizePadding();
          _scrollAllowed = false;
          _scrollGuardX = window.scrollX;
          _scrollGuardY = window.scrollY;
          restoreIframePointerEvents(wrapper);
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
          updateSingletonPosition();

          var state = editorStates.get(blockIndex);
          var newWidth = Math.max(20, wrapper.offsetWidth);
          if (state) {
            state.explicitHeight = true;
            state.explicitWidth = true;
            state.blockWidth = newWidth;
          }

          // Linked .drawio.svg images carry no markdown width/height to persist.
          var rzLink2 = diagramBlocks[blockIndex];
          if (!(rzLink2 && rzLink2.linkTarget)) {
            vscode.postMessage({
              type: 'diagramResized',
              blockIndex: blockIndex,
              height: Math.max(20, wrapper.offsetHeight),
              width: newWidth,
              diagramId: state ? state.diagramId : null,
            });
          }
        }
      }

      // ──────────────────────────────────────────────────────────────
      // HTML → Markdown converter
      // ──────────────────────────────────────────────────────────────
      function htmlToMarkdown(container) {
        var md = '';
        for (var i = 0; i < container.childNodes.length; i++)
          md += nodeToMarkdown(container.childNodes[i]);
        return md.replace(/\n{3,}/g, '\n\n').trimEnd() + '\n';
      }

      function nodeToMarkdown(node) {
        if (node.nodeType === Node.TEXT_NODE) return node.textContent;
        if (node.nodeType !== Node.ELEMENT_NODE) return '';

        var el = node, tag = el.tagName.toLowerCase();
        var inner = childrenToMarkdown(el);

        switch (tag) {
          case 'h1': return '# ' + inner.trim() + '\n\n';
          case 'h2': return '## ' + inner.trim() + '\n\n';
          case 'h3': return '### ' + inner.trim() + '\n\n';
          case 'h4': return '#### ' + inner.trim() + '\n\n';
          case 'h5': return '##### ' + inner.trim() + '\n\n';
          case 'h6': return '###### ' + inner.trim() + '\n\n';
          case 'p': return inner + '\n\n';
          case 'strong': case 'b': return '**' + inner + '**';
          case 'em': case 'i': return '*' + inner + '*';
          case 'a': return '[' + inner + '](' + (el.getAttribute('href') || '') + ')';
          case 'img':
            {
              var imgSrc = el.getAttribute('src') || '';
              if (imageBaseUri && imgSrc.indexOf(imageBaseUri + '/') === 0) {
                imgSrc = imgSrc.substring(imageBaseUri.length + 1);
              }
              return '![' + (el.getAttribute('alt') || '') + '](' + imgSrc + ')';
            }
          case 'code':
            if (el.parentElement && el.parentElement.tagName === 'PRE') return inner;
            return '`' + inner + '`';
          case 'pre':
            var codeEl = el.querySelector('code'), lang = '';
            if (codeEl) {
              var m = (codeEl.className || '').match(/language-(\w+)/);
              if (m) lang = m[1];
              inner = codeEl.textContent;
            }
            return '```' + lang + '\n' + inner + '\n```\n\n';
          case 'blockquote': return '> ' + inner.trim() + '\n\n';
          case 'ul': return inner + '\n';
          case 'ol': return inner + '\n';
          case 'li': return '- ' + inner.trim() + '\n';
          case 'hr': return '---\n\n';
          case 'br': return '\n';
          case 'div':
            if (inner.trim()) return inner + '\n';
            return '';
          default: return inner;
        }
      }

      function childrenToMarkdown(el) {
        var result = '';
        for (var i = 0; i < el.childNodes.length; i++)
          result += nodeToMarkdown(el.childNodes[i]);
        return result;
      }

      // ──────────────────────────────────────────────────────────────
      // Cleanup
      // ──────────────────────────────────────────────────────────────
      function cleanupAllEditors(destroySingleton) {
        if (focusPollTimer) { clearInterval(focusPollTimer); focusPollTimer = null; }
        // Detach the singleton from the old diagram state but keep the iframe
        // alive so draw.io doesn't have to reload on every content update.
        if (_singletonActiveState) singletonDetach();
        if (destroySingleton) destroySingletonIframe();
        for (var key in diagramSaveTimers) clearTimeout(diagramSaveTimers[key]);
        diagramSaveTimers = {};
        if (textSaveTimer) { clearTimeout(textSaveTimer); textSaveTimer = null; }
        editorStates.clear();
        textSections = [];
        _lastInteractedEndLine = null;
        activeEditorIndex = -1;
      }

      // Tell the extension we're ready
      vscode.postMessage({ type: 'previewReady' });
    })();
  </script>
</body>

</html>
